name = "cfrss"
main = "src/index.ts"
compatibility_date = "2024-12-30"

[build]
# Build the browser bundle on every deploy and every preview upload
command = "npm run build:client"

# ===== 定时任务：每小时整点自动抓取订阅新文章（新文章以未读状态呈现） =====
[triggers]
crons = ["0 * * * *"]

[vars]
# 每次定时任务最多刷新的订阅数（免费版 10ms CPU 限制，超出部分按最旧优先在后续小时轮转）
CRON_MAX_FEEDS = "10"

[assets]
directory = "./public"
not_found_handling = "single-page-application"
# The feed paths go to the Worker first so public tag and folder feeds can be served.
run_worker_first = ["/api/*", "/tag/*/feed.xml", "/tag/*/feed.json", "/*/feed.xml", "/*/feed.json"]

[[d1_databases]]
binding = "DB"
database_name = "cfrss-db"
database_id = "158c1f2b-40d9-4394-98c8-50441226596a"
migrations_dir = "migrations"
